<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Create Task</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: #030712; /* Extreme dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Modal Container - Matches your image size */
        .modal {
            background-color: #111827;
            width: 100%;
            max-width: 600px; /* Width fixed taaki stretch na ho */
            border-radius: 12px;
            border: 1px solid #1f2937;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: white;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 1.1rem; font-weight: 600; }
        .modal-header p { font-size: 0.8rem; color: #9ca3af; margin-top: 4px; }

        .modal-body { padding: 24px; }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-size: 0.85rem; 
            margin-bottom: 8px; 
            color: #f3f4f6; 
            font-weight: 500;
        }
        label span { color: #ef4444; margin-left: 2px; }

        input, textarea, select {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus { border-color: #3b82f6; }

        /* Two column layout for Date & Priority */
        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-with-icon {
            position: relative;
        }
        .input-with-icon i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 0.9rem;
        }
        .input-with-icon input, .input-with-icon select {
            padding-left: 38px;
        }

        /* Assignees styling */
        .assignee-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .btn-add {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .user-chip {
            background: #1f2937;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #374151;
        }
        .user-avatar { width: 20px; height: 20px; background: #4b5563; border-radius: 50%; }

        /* Upload area */
        .upload-box {
            border: 1px dashed #374151;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: #9ca3af;
            margin-top: 8px;
            background: #0f172a;
        }
        .upload-box i { font-size: 1.5rem; margin-bottom: 10px; color: #6b7280; }
        .upload-box b { color: white; }

        .modal-footer {
            padding: 16px 24px;
            background-color: #111827;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
        }
        .btn-secondary { background: #374151; color: white; }
        .btn-primary { background: #2563eb; color: white; }

    </style>
</head>
<body>

    <div class="modal">
        <div class="modal-header">
            <div>
                <h2>Create New Task</h2>
                <p>Fill in the details below to add a new task to your board.</p>
            </div>
            <i class="fas fa-times" style="color:#9ca3af; cursor:pointer;"></i>
        </div>

        <div class="modal-body">
            <div class="form-group">
                <label>Task Title <span>*</span></label>
                <input type="text" placeholder="e.g. Redesign Homepage Hero Section">
            </div>

            <div class="grid-row">
                <div class="form-group">
                    <label>Due Date</label>
                    <div class="input-with-icon">
                        <i class="far fa-calendar"></i>
                        <input type="text" placeholder="Select date">
                    </div>
                </div>
                <div class="form-group">
                    <label>Priority Level</label>
                    <div class="input-with-icon">
                        <i class="fas fa-flag"></i>
                        <select>
                            <option>Medium Priority</option>
                            <option>High Priority</option>
                            <option>Low Priority</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea placeholder="Add detailed notes regarding this task..."></textarea>
            </div>

            <div class="form-group">
                <label>Assignees</label>
                <div class="assignee-section">
                    <button class="btn-add"><i class="fas fa-plus-circle"></i> Add Member</button>
                    <div class="user-chip">
                        <div class="user-avatar"></div>
                        Sarah K. <i class="fas fa-times" style="font-size: 10px; cursor:pointer;"></i>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Attachments & Thumbnails</label>
                <div class="upload-box">
                    <i class="fas fa-cloud-upload-alt"></i><br>
                    <b>Click to upload</b> or drag and drop<br>
                    <span style="font-size: 0.75rem;">SVG, PNG, JPG or GIF (MAX. 800x400px)</span>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary"><i class="fas fa-check" style="margin-right:5px;"></i> Save Task</button>
        </div>
    </div>

</body>
</html>
