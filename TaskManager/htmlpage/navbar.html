<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Header</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        :root {
            --nav-bg: #0f172a;
            --border: #1e293b;
            --blue: #2563eb;
            --text-muted: #94a3b8;
        }

        .navbar {
            background-color: var(--nav-bg);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            color: white;
        }

        /* Left side: Logo */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            background-color: var(--blue);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
        }

        /* Right side: Actions */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-create {
            background-color: var(--blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-create:hover { background-color: #1d4ed8; }

        .search-trigger {
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            padding: 8px;
        }

        .icon-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            position: relative;
        }

        .icon-btn:hover { background-color: #1e293b; color: white; }

        .notif-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            border: 2px solid var(--nav-bg);
        }

        .divider {
            width: 1px;
            height: 24px;
            background-color: var(--border);
            margin: 0 8px;
        }

        /* Profile */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .logo-text, .btn-create span { display: none; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo-icon">
                <i class="fas fa-check-double"></i>
            </div>
            <span class="logo-text">TaskMaster</span>
        </div>

        <div class="nav-right">
            <button class="btn-create">
                <i class="fas fa-plus"></i>
                <span>Create Task</span>
            </button>

            <div class="icon-group">
                <i class="fas fa-search search-trigger"></i>
                
                <button class="icon-btn">
                    <i class="far fa-bell"></i>
                    <span class="notif-badge"></span>
                </button>
            </div>

            <div class="divider"></div>

            <div class="user-profile">
                <div class="avatar">AM</div>
                <i class="fas fa-chevron-down" style="font-size: 0.7rem; color: var(--text-muted);"></i>
            </div>
        </div>
    </nav>

</body>
</html>
