<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0b111b;
            --card-bg: #101827;
            --input-bg: #1f2937;
            --border-color: #374151;
            --blue-accent: #2563eb;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Navigation / Header style from screenshot */
        .top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .logo-box {
            background: var(--blue-accent);
            padding: 5px 8px;
            border-radius: 6px;
        }

        .login-link-top {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .login-btn-nav {
            background: #1f2937;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            margin-left: 10px;
            border: 1px solid var(--border-color);
        }

        /* Main Container */
        .signup-card {
            width: 100%;
            max-width: 500px;
            margin-top: 80px; /* Space for top nav */
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* Social Buttons */
        .social-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .social-btn:hover { background: #1f2937; }

        .divider {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin: 0 15px;
        }

        /* Form Fields */
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus { border-color: var(--blue-accent); }

        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Submit Button */
        .create-btn {
            width: 100%;
            padding: 14px;
            background: var(--blue-accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .social-row { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <div class="logo-container">
            <div class="logo-box"><i class="fas fa-check-double"></i></div>
            TaskMaster
        </div>
        <div class="login-link-top">
            Already a member? <a href="#" class="login-btn-nav">Log In</a>
        </div>
    </nav>

    <div class="signup-card">
        <h1>Create your account</h1>
        <p class="subtitle">Start organizing your tasks and projects today.</p>

        <div class="social-row">
            <button class="social-btn">
                <img src="https://www.gstatic.com/images/branding/product/1x/googleg_32dp.png" width="18"> Google
            </button>
            <button class="social-btn">
                <i class="fab fa-github"></i> GitHub
            </button>
        </div>

        <div class="divider">Or register with email</div>

        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <input type="password" placeholder="Create a password">
                    <i class="far fa-eye eye-icon"></i>
                </div>
            </div>

            <button type="submit" class="create-btn">Create Account</button>
        </form>
    </div>

</body>
</html>
